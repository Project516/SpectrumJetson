// SpectrumVision: one library, two builds. src/ is written against WPILib 2026; the 2027 build
// compiles a copy generated by tools/port2027.py (WPILib 2027 renamed its packages).
rootProject.name = 'spectrum-vision'
include 'wpilib2026'   // roboRIO: WPILib 2026.2.1, PhotonLib v2026.3.4, Java 17
include 'wpilib2027'   // SystemCore: WPILib 2027.0.0-alpha-6, PhotonLib v2027.0.0-alpha-2, Java 25
