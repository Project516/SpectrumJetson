<!DOCTYPE html><html><body style="margin:0;background:#1a0a2b">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/RoomEnvironment.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1200, 800); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping;
const s = new THREE.Scene(); s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(35, 1.5, 0.01, 10);
const col = { pcb: 0x0d2a1a, carrier_parts: 0x222222, module: 0x333338, heatsink: 0x1b1b1f, fan: 0x111111, base: 0x151515, ssd: 0x101010, wifi: 0x1f5a2a, antennas: 0x777777, sodimm: 0x151515 };
const l = new GLTFLoader(); l.setMeshoptDecoder(MeshoptDecoder);
const f = location.hash.slice(1) || 'jetson-devkit';
l.load('../assets/models/' + f + '.glb', (g) => {
  const root = g.scene; root.rotation.x = -Math.PI / 2; s.add(root);
  const names = [];
  root.traverse((o) => { if (o.isMesh) { names.push(o.parent.name + '/' + o.name); o.material = new THREE.MeshStandardMaterial({ color: col[o.name] ?? 0xb8bcc4, metalness: col[o.name] ? 0.2 : 0.9, roughness: 0.45, side: THREE.DoubleSide }); } });
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3()).length();
  cam.position.copy(c).add(new THREE.Vector3(0.5, 0.55, 0.7).multiplyScalar(sz)); cam.lookAt(c);
  r.render(s, cam); document.title = 'done ' + names.join(',');
});
</script></body></html>
